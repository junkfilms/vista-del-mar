<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUNK Films — Summer 2026 Post-Production Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#fafaf8;color:#1a1a18;padding:24px;max-width:1100px;margin:0 auto}
.header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.header h1{font-size:15px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:#1a1a18}
.header .updated{font-size:11px;color:#999}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.nav button{background:#fff;border:1px solid #ddd;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;font-family:inherit;color:#333;transition:background 0.15s}
.nav button:hover{background:#f0f0ee}
.nav select{border:1px solid #ddd;border-radius:6px;padding:5px 10px;font-size:13px;font-family:inherit;background:#fff;color:#333}
.month-title{font-size:20px;font-weight:500;margin-right:auto;padding-right:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #e0dfdb;border-radius:10px;overflow:hidden;background:#fff}
.dow{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.08em;padding:8px 6px;text-align:center;background:#f6f6f3;border-bottom:1px solid #e0dfdb}
.day{min-height:105px;padding:4px;border:0.5px solid #eeedea;background:#fff;position:relative;transition:background 0.1s}
.day:hover{background:#fdfdfb}
.day.other{background:#f9f9f7;opacity:0.4}
.day.today{outline:2px solid #6B5CE7;outline-offset:-2px;z-index:1}
.day.weekend{background:#fdfcfa}
.daynum{font-size:11px;color:#aaa;margin-bottom:3px;font-weight:500;padding:0 2px}
.day.today .daynum{color:#6B5CE7;font-weight:600}
.ev{font-size:8.5px;padding:2px 5px;margin-bottom:1.5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;line-height:1.35;font-weight:500;transition:opacity 0.1s}
.ev:hover{opacity:0.8}
.legends{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px;padding:12px 0;border-top:1px solid #e0dfdb}
.leg-section{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.leg-section-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#999;margin-right:4px;width:100%}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#666}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.leg-phase{width:16px;height:9px;border-radius:2px;flex-shrink:0}
.tooltip{display:none;position:fixed;z-index:999;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px 12px;font-size:12px;color:#333;max-width:260px;line-height:1.5;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
.footer{margin-top:16px;font-size:10px;color:#bbb;text-align:center}
</style>
</head>
<body>

<div class="header">
<h1>JUNK Films — Summer 2026 Post-Production Schedule</h1>
<span class="updated">Last updated: May 10, 2026</span>
</div>

<div class="nav">
<span class="month-title" id="mT"></span>
<button onclick="nm(-1)">&#8592;</button>
<button onclick="nm(1)">&#8594;</button>
<select id="mS" onchange="jm(this.value)"></select>
</div>

<div class="grid" id="cG"></div>

<div class="legends">
<div class="leg-section" id="projLeg">
<div class="leg-section-title">Projects</div>
</div>
<div class="leg-section" id="phaseLeg">
<div class="leg-section-title">Phases</div>
</div>
</div>

<div class="tooltip" id="tt"></div>

<div class="footer">junkfilms.github.io/vista-del-mar</div>

<script>
const P=[
  {id:'banner',n:'Banner Health',c:'#C84520',phases:[
    {p:'travel',l:'Travel to AZ',s:'2026-05-17',e:'2026-05-17'},
    {p:'shoot',l:'Shoot (Tucson)',s:'2026-05-18',e:'2026-05-20'},
    {p:'post',l:'Ingest + cataloguing',s:'2026-05-21',e:'2026-05-22'},
    {p:'post',l:'Editorial — 3 hero films',s:'2026-05-26',e:'2026-06-05'},
    {p:'review',l:'Client review + revisions',s:'2026-06-05',e:'2026-06-18'},
    {p:'delivery',l:'Finals / masters due',s:'2026-06-19',e:'2026-06-19'}
  ]},
  {id:'pbs',n:'PBS Artbound',c:'#6B5CE7',phases:[
    {p:'post',l:'Editorial — 2 episodes',s:'2026-05-18',e:'2026-06-14'},
    {p:'post',l:'Color + sound mix + combine',s:'2026-06-15',e:'2026-06-21'},
    {p:'delivery',l:'Final 30-min episode',s:'2026-06-22',e:'2026-06-22'}
  ]},
  {id:'epi',n:'EPI Sacramento',c:'#1AA876',phases:[
    {p:'shoot',l:'Shoot day',s:'2026-05-15',e:'2026-05-15'},
    {p:'post',l:'Post-production',s:'2026-05-16',e:'2026-06-08'},
    {p:'delivery',l:'Final delivery',s:'2026-06-15',e:'2026-06-15'}
  ]},
  {id:'warp',n:'Warp Nightshift',c:'#2B7BD5',phases:[
    {p:'prepro',l:'Pre-production',s:'2026-05-09',e:'2026-05-26'},
    {p:'shoot',l:'Shoot day',s:'2026-05-27',e:'2026-05-27'},
    {p:'post',l:'Rough cut + hero edit',s:'2026-05-29',e:'2026-06-05'},
    {p:'post',l:'Cutdown edit',s:'2026-06-08',e:'2026-06-12'},
    {p:'post',l:'Follow-on episodes',s:'2026-06-15',e:'2026-06-19'}
  ]},
  {id:'flexfit',n:'Flexfit Catalog',c:'#C24B7A',phases:[
    {p:'shoot',l:'Shoot days',s:'2026-05-31',e:'2026-06-01'},
    {p:'post',l:'Video R1 edits due',s:'2026-06-15',e:'2026-06-15'},
    {p:'review',l:'GS + client review R1',s:'2026-06-16',e:'2026-06-24'},
    {p:'post',l:'Video R2 edits due',s:'2026-06-29',e:'2026-06-29'},
    {p:'review',l:'GS + client review R2',s:'2026-06-30',e:'2026-07-07'},
    {p:'post',l:'Video R3 — final tweaks',s:'2026-07-11',e:'2026-07-11'},
    {p:'delivery',l:'Video final delivery',s:'2026-07-15',e:'2026-07-15'}
  ]},
  {id:'merck-onc',n:'Merck Oncology',c:'#B07015',phases:[
    {p:'prepro',l:'Script + storyboard dev',s:'2026-04-20',e:'2026-05-11'},
    {p:'review',l:'Merck review + approval',s:'2026-05-12',e:'2026-06-05'},
    {p:'shoot',l:'Production (Rahway NJ)',s:'2026-06-08',e:'2026-06-19'},
    {p:'post',l:'VO recording',s:'2026-06-08',e:'2026-06-19'},
    {p:'post',l:'Editing — 3 films',s:'2026-06-22',e:'2026-07-03'},
    {p:'review',l:'Merck review + revisions',s:'2026-07-06',e:'2026-07-24'},
    {p:'review',l:'CBDB review',s:'2026-07-27',e:'2026-08-05'},
    {p:'delivery',l:'Finishing + masters',s:'2026-08-06',e:'2026-08-12'}
  ]},
  {id:'merck-mrl',n:'Merck MRL',c:'#8B4513',phases:[
    {p:'post',l:'Editorial (supplied footage)',s:'2026-06-08',e:'2026-07-03'},
    {p:'review',l:'Review + revisions',s:'2026-07-06',e:'2026-07-24'},
    {p:'delivery',l:'Finishing + masters',s:'2026-08-06',e:'2026-08-12'}
  ]},
  {id:'bt1',n:'Beyond Type 1',c:'#4D8B1A',phases:[
    {p:'prepro',l:'Pre-production',s:'2026-05-01',e:'2026-06-14'},
    {p:'shoot',l:'Production (multi-location)',s:'2026-06-15',e:'2026-06-26'},
    {p:'post',l:'Post-production',s:'2026-07-01',e:'2026-07-31'},
    {p:'delivery',l:'Final delivery',s:'2026-08-15',e:'2026-08-15'}
  ]},
  {id:'stryd',n:'STRYD Motorcycles',c:'#6B6B65',phases:[
    {p:'shoot',l:'Shoot (2 days)',s:'2026-06-29',e:'2026-06-30'},
    {p:'post',l:'Post-production',s:'2026-07-01',e:'2026-07-20'}
  ]}
];

let cY=2026,cM=4;
const pad=n=>String(n).padStart(2,'0');
const mk=s=>new Date(s+'T00:00:00');
const fmt=(y,m)=>new Date(y,m).toLocaleDateString('en-US',{month:'long',year:'numeric'});

function evStyle(c,phase){
  const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  switch(phase){
    case 'shoot': return {bg:`rgba(${r},${g},${b},0.18)`,fg:c,bl:`3px solid ${c}`};
    case 'delivery': return {bg:c,fg:'#fff',bl:'none'};
    case 'review': return {bg:`rgba(${r},${g},${b},0.08)`,fg:c,bl:`3px dashed ${c}`};
    case 'prepro': return {bg:`rgba(${r},${g},${b},0.06)`,fg:`rgba(${r},${g},${b},0.7)`,bl:`3px dotted rgba(${r},${g},${b},0.5)`};
    case 'travel': return {bg:`rgba(${r},${g},${b},0.06)`,fg:`rgba(${r},${g},${b},0.6)`,bl:`3px solid rgba(${r},${g},${b},0.3)`};
    default: return {bg:`rgba(${r},${g},${b},0.14)`,fg:c,bl:`3px solid ${c}`};
  }
}

function getEvts(y,m,day){
  const ds=`${y}-${pad(m+1)}-${pad(day)}`;const dt=mk(ds);let evts=[];
  P.forEach(p=>{p.phases.forEach(ph=>{
    const s=mk(ph.s),e=mk(ph.e);
    if(dt>=s&&dt<=e) evts.push({proj:p.n,c:p.c,l:ph.l,phase:ph.p});
  })});
  evts.sort((a,b)=>{
    const o={shoot:0,delivery:1,post:2,review:3,prepro:4,travel:5};
    return (o[a.phase]||9)-(o[b.phase]||9);
  });
  return evts;
}

function render(){
  const g=document.getElementById('cG');g.innerHTML='';
  ['sun','mon','tue','wed','thu','fri','sat'].forEach(d=>{
    const el=document.createElement('div');el.className='dow';el.textContent=d;g.appendChild(el);
  });
  const fd=new Date(cY,cM,1).getDay();
  const dim=new Date(cY,cM+1,0).getDate();
  const pd=new Date(cY,cM,0).getDate();
  const now=new Date();
  const todayS=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  for(let i=0;i<fd;i++){
    const el=document.createElement('div');el.className='day other';
    el.innerHTML=`<div class="daynum">${pd-fd+1+i}</div>`;g.appendChild(el);
  }
  for(let day=1;day<=dim;day++){
    const ds=`${cY}-${pad(cM+1)}-${pad(day)}`;
    const dow=new Date(cY,cM,day).getDay();
    const el=document.createElement('div');
    el.className='day'+(ds===todayS?' today':'')+(dow===0||dow===6?' weekend':'');
    el.innerHTML=`<div class="daynum">${day}</div>`;
    const evts=getEvts(cY,cM,day);
    evts.slice(0,5).forEach(ev=>{
      const st=evStyle(ev.c,ev.phase);
      const chip=document.createElement('div');chip.className='ev';
      let label=ev.phase==='delivery'?'\u2605 '+ev.proj:ev.proj;
      chip.textContent=label;
      chip.style.cssText=`background:${st.bg};color:${st.fg};border-left:${st.bl}`;
      if(ev.phase==='delivery') chip.style.cssText=`background:${st.bg};color:${st.fg};border:none;text-align:center;font-weight:600`;
      chip.addEventListener('mouseenter',e=>{
        const tt=document.getElementById('tt');
        const pn={shoot:'Shoot',delivery:'Delivery',post:'Post-production',review:'Client review',prepro:'Pre-production',travel:'Travel'}[ev.phase]||ev.phase;
        tt.innerHTML=`<div style="font-weight:600;margin-bottom:3px">${ev.proj}</div><div>${ev.l}</div><div style="margin-top:5px;font-size:10px;color:#999;display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${ev.c}"></span>${pn}</div>`;
        tt.style.display='block';
        const r=e.target.getBoundingClientRect();
        tt.style.left=Math.min(r.left,window.innerWidth-270)+'px';
        tt.style.top=(r.bottom+8)+'px';
      });
      chip.addEventListener('mouseleave',()=>document.getElementById('tt').style.display='none');
      el.appendChild(chip);
    });
    if(evts.length>5){
      const m=document.createElement('div');m.className='ev';
      m.style.cssText='background:#f0f0ee;color:#999;border:none;text-align:center';
      m.textContent=`+${evts.length-5} more`;el.appendChild(m);
    }
    if(evts.length===0) el.style.opacity='0.55';
    g.appendChild(el);
  }
  const tc=fd+dim;const rem=tc%7===0?0:7-tc%7;
  for(let i=1;i<=rem;i++){
    const el=document.createElement('div');el.className='day other';
    el.innerHTML=`<div class="daynum">${i}</div>`;g.appendChild(el);
  }
  document.getElementById('mT').textContent=fmt(cY,cM);
}

function renderLg(){
  const pl=document.getElementById('projLeg');
  P.forEach(p=>{
    const i=document.createElement('div');i.className='leg-item';
    i.innerHTML=`<div class="leg-dot" style="background:${p.c}"></div><span>${p.n}</span>`;
    pl.appendChild(i);
  });
  const phl=document.getElementById('phaseLeg');
  [{l:'Shoot',s:'background:rgba(100,100,100,0.15);border-left:3px solid #555'},
   {l:'Post-production',s:'background:rgba(100,100,100,0.12);border-left:3px solid #888'},
   {l:'Client review',s:'background:rgba(100,100,100,0.06);border-left:3px dashed #888'},
   {l:'Delivery',s:'background:#555'},
   {l:'Pre-production',s:'background:rgba(100,100,100,0.05);border-left:3px dotted #999'}
  ].forEach(ph=>{
    const i=document.createElement('div');i.className='leg-item';
    i.innerHTML=`<div class="leg-phase" style="${ph.s}"></div><span>${ph.l}</span>`;
    phl.appendChild(i);
  });
}

function nm(d){cM+=d;if(cM>11){cM=0;cY++}if(cM<0){cM=11;cY--}render();document.getElementById('mS').value=cY+'-'+cM}
function jm(v){const[y,m]=v.split('-');cY=+y;cM=+m;render()}

const sel=document.getElementById('mS');
for(let m=4;m<=8;m++){const o=document.createElement('option');o.value='2026-'+m;o.textContent=fmt(2026,m);sel.appendChild(o)}
sel.value='2026-4';
render();renderLg();
</script>
</body>
</html>
